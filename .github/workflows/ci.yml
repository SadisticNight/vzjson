name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run unit and doc tests
        run: cargo test --lib --doc

      - name: Clone JSONTestSuite
        run: git clone --depth 1 https://github.com/nst/JSONTestSuite.git tests/JSONTestSuite

      - name: Run JSONTestSuite
        run: cargo test --test json_test_suite -- --nocapture

      - name: Check benches compile
        run: cargo check --benches
